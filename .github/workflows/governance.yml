name: ServiceOS Governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository governance
        run: python3 scripts/governance-check.py

  foundation:
    runs-on: ubuntu-latest
    services:
      # WORK-002: live-PostgreSQL integration proofs (identity/tenancy durable
      # state, constraint arbitration, transactional tenant-integrity rules)
      # run for real in CI through SERVICEOS_TEST_DATABASE_URL.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: serviceos
          POSTGRES_PASSWORD: serviceos
          POSTGRES_DB: serviceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviceos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SERVICEOS_TEST_DATABASE_URL: postgres://serviceos:serviceos@localhost:5432/serviceos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install toolchain
        run: npm ci
      - name: Build, configuration, architecture structural checks and governance frontier validation
        run: npm run check
        env:
          # On pull requests this is the source branch; on main it is "main".
          # Unprefixed on purpose: unknown SERVICEOS_* variables fail the
          # configuration typo guard.
          EXPECT_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Behavioral, structural, discrimination and live-PostgreSQL tests
        # Runs even when the repository governance validation above has failed
        # on a pre-existing main-branch state issue: WORK-002's CRITICAL
        # assurance requires the behavioral and live-database proof results to
        # be independently visible for Architect review. The job still fails
        # overall when any step fails.
        if: always()
        run: npm test
